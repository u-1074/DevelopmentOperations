# ansible/playbook.yml
- name: Déployer Nginx avec Hello World
  hosts: web
  become: true            # exécute en root (sudo)
  tasks:
    - name: Installer Nginx
      apt:
        name: nginx
        state: present

    - name: Copier la page Hello World
      copy:
        src: ../index.html
        dest: /var/www/html/index.html

    - name: Démarrer Nginx
      service:
        name: nginx
        state: started
        enabled: true

