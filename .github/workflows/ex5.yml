
name: Divisions

env:
  int: 100

on:
  push:
    branches: ["val", "dev", "prod"]
  
  workflow_dispatch:
  


jobs:
  
  dev:
    if: ${{ github.ref_name == 'dev' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Dev div
        run: |
          if [ $(( ${{ env.int }}%2 )) -eq 0 ];
          echo ${{ env.int }}
          then echo "int=$(( $int/2 ))" >> $GITHUB_ENV
          fi
    
  val:
    if: ${{ github.ref_name == 'val' }}
    needs: dev
    runs-on: ubuntu-latest
    
    steps:
      - name: Val div
        run: |
          if [ $(( ${{ env.int }}%2 )) -eq 0 ];
          echo ${{ env.int }}
          then echo "int=$(( $int/4 ))" >> $GITHUB_ENV
          fi
        
  prod:
    if: ${{ github.ref_name == 'prod' }}
    runs-on: ubuntu-latest
    needs: [dev, val]
    
    steps:
      - name: Prod div
        run: |
          if [ $(( ${{ env.int }}%2 )) -eq 0 ];
          echo ${{ env.int }}
          then echo "int=$(( $int/8 ))" >> $GITHUB_ENV
          fi



