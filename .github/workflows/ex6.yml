

name: Page deployment

on:
  push:
    branches: ["main"]
  
  workflow_dispatch:

jobs:

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Installing node.js
        run: actions/setup-node@v4
        with:
          node-version: 22
     
      - name: Installing lint
        run: npm install @linthtml/linthtml --save-dev
      
      - name: Running lint
        run: npx linthtml index.html

  deploy:
    needs: lint
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
        
    permissions:
      contents: read
      pages: write
      id-token: write
      
        
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v4
