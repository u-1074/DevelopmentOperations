
# Put space in "- uses" and align others accordingly
# Likewise, put space when using variables : ${{ VAR }}
# If VAR is stored in A use B
# 		environment variables -> ${{ vars.VAR }}
# 		environment secrets -> ${{ secrets.VAR }}
# 		job env tag -> ${{ env.VAR }}


name: NomPrenomMail

on:
  push:
    branches: ["main"]
  
  workflow_dispatch:
  
jobs:
  print_name:
    runs-on: ubuntu-latest
    env:
     VAR: "example of a variable that can be accessed in this job under the name ${{ env.VAR }}"
    
    steps:
      - uses: actions/checkout@v4
    
      - name: printing_name
        run: |
          echo ${{ secrets.NAME }}
     
  print_surname:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
    
      - name: printing_surname
        run: |
          echo ${{ secrets.SURNAME }}
       
  print_email:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
    
      - name: printing_email
        run: |
          echo ${{ secrets.EMAIL }}


  
    
